<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#211a15">
  <meta name="description" content="Mira los recuerdos que los invitados comparten de la boda de Abril & Ricardo.">
  <title>Galería de recuerdos | Abril & Ricardo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Marcellus&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/drive-gallery-page.css">
  <link rel="stylesheet" href="css/infinite-gallery.css">
</head>
<body class="ag-gallery-page">
  <main class="ag-drive-stage" aria-label="Galería infinita de fotografías compartidas">
    <div class="ag-drive-canvas ag-drive-loading" id="agDriveInfiniteGallery"></div>
    <nav class="ag-drive-topbar" aria-label="Navegación de la galería">
      <a class="ag-stage-back" href="index.html?skipEnvelope=1#inicio">‹ Volver a la invitación</a>
      <span class="ag-stage-label">ABRIL &amp; RICARDO · RECUERDOS COMPARTIDOS</span>
      <button class="ag-stage-refresh" id="agRefreshDriveGallery" type="button" aria-label="Actualizar fotografías">↻</button>
    </nav>
    <div class="ag-drive-stage-bottom">
      <p id="agDriveGalleryStatus" role="status" aria-live="polite">Preparando la galería…</p>
      <a class="ag-share-link" href="compartir-recuerdo.html">COMPARTIR UN RECUERDO <span aria-hidden="true">↗</span></a>
    </div>
  </main>
  <script src="js/photo-booth-config.js"></script>
  <script src="js/drive-gallery.js"></script>
  <script src="js/infinite-gallery.js"></script>
  <script src="js/drive-infinite-gallery.js"></script>
</body>
</html>
